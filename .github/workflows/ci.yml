name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: gofmt / vet / unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache: true

      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: unit tests
        run: go test ./...

  integration:
    name: integration tests against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: s2t
          POSTGRES_PASSWORD: s2t
          POSTGRES_DB: s2t
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U s2t -d s2t"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache: true

      - name: Integration tests
        run: go test -race -tags integration ./pkg/processors ./tests